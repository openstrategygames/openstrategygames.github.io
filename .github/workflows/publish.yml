name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Lora and Montserrat fonts for Typst
        run: |
          mkdir -p /tmp/typst-fonts
          BASE="https://raw.githubusercontent.com/google/fonts/main/ofl"
          for v in Regular Italic Bold BoldItalic; do
            curl -fL "$BASE/lora/static/Lora-${v}.ttf" -o /tmp/typst-fonts/Lora-${v}.ttf
          done
          for v in Regular Medium SemiBold Bold Black; do
            curl -fL "$BASE/montserrat/static/Montserrat-${v}.ttf" -o /tmp/typst-fonts/Montserrat-${v}.ttf
          done

      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TYPST_FONT_PATHS: /tmp/typst-fonts
