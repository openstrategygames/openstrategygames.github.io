name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Lora and Montserrat fonts for Typst
        run: |
          mkdir -p ~/.local/share/fonts
          curl -sL "https://raw.githubusercontent.com/google/fonts/main/ofl/lora/Lora%5Bwght%5D.ttf" \
            -o ~/.local/share/fonts/Lora.ttf
          curl -sL "https://raw.githubusercontent.com/google/fonts/main/ofl/lora/Lora%5Bital%2Cwght%5D.ttf" \
            -o ~/.local/share/fonts/Lora-Italic.ttf
          curl -sL "https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf" \
            -o ~/.local/share/fonts/Montserrat.ttf
          curl -sL "https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/Montserrat%5Bital%2Cwght%5D.ttf" \
            -o ~/.local/share/fonts/Montserrat-Italic.ttf
          fc-cache -fv

      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
